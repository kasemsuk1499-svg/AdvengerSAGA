<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" aria-label="มือปืนหญิงอนิเมะ ผมสีเงินฟ้า สวมเสื้อคลุมยุทธวิธีและถือปืนพลังงานสองกระบอก">
